<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>Offline · Evo Stays</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #18181b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        height: 56px;
        width: auto;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1.25rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #52525b;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 0.7rem 1.4rem;
        border-radius: 0.5rem;
        border: 0;
        background: #18181b;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Evo Stays" />
      <h1>You're offline</h1>
      <p>Evo Stays can't reach the internet right now. Check your signal, then try again. Nothing you've already saved is lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
